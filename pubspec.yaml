name: yonca
description: YONCA - personal CRM for one salesperson. Offline first, English and Arabic.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.0
  url_launcher: ^6.3.0
  path: ^1.9.0
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  record: ^6.0.0
  audioplayers: ^6.1.0
  file_picker: ^10.1.0
  open_filex: ^4.5.0
  crypto: ^3.0.3
  quick_actions: ^1.0.8
  home_widget: ^0.7.0
  pdf: ^3.11.0
  archive: ^4.5.0
  share_plus: ^10.1.4
  flutter_contacts: ^1.1.9+2
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  dynamic_color: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.0

# The pdf package pulls in image 4.x, which needs a newer archive than pub picks by default.
dependency_overrides:
  archive: ^4.5.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto_700Bold.ttf
          weight: 700
    - family: YoncaIndicDigits
      fonts:
        - asset: assets/fonts/YoncaIndicDigits_400Regular.ttf
          weight: 400
        - asset: assets/fonts/YoncaIndicDigits_500Medium.ttf
          weight: 500
        - asset: assets/fonts/YoncaIndicDigits_700Bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo_700Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic_400Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic_500Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic_700Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic_400Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic_500Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic_700Bold.ttf
          weight: 700
