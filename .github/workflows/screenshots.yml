name: Screenshots
# Renders the app's screens to PNG so they can be compared with the design canvases.
# Run it by hand: Actions > Screenshots > Run workflow, then download the "screens" artifact.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Render screens
        run: |
          export FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")"
          export SCREENSHOT_DIR="$PWD/build/screens"
          timeout 25m flutter test tool/screens/screens_test.dart --reporter expanded 2>&1 | tee build/screens/test_output.txt | tail -60 || true
          ls "$SCREENSHOT_DIR" | wc -l
          cat "$SCREENSHOT_DIR/errors.txt" | head -80 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: build/screens
      - name: Publish pictures to the screenshots branch
        if: always()
        run: |
          cd build/screens
          git init -q
          git checkout -q -b screenshots
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "Screens from run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" screenshots
