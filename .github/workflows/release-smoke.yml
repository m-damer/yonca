name: Release smoke test
# Builds the RELEASE APK (the same R8 shrinking as the published one) and starts it on an emulator.
# Prints the app's crash log, so a release that closes at once can be diagnosed. Run by hand.
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release --target-platform android-x64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start it on an emulator and read the log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell monkey -p com.yonca.app -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell pidof com.yonca.app || echo "PROCESS IS NOT RUNNING (it closed)"
            adb logcat -d -v time > logcat.txt || true
            echo "=== FATAL / crash lines ==="
            grep -E "FATAL EXCEPTION|AndroidRuntime|E/flutter|Exception|Error|ClassNotFound|NoSuchMethod|UnsatisfiedLink|Process com.yonca.app" logcat.txt | grep -v "chatty" | head -60 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logcat
          path: logcat.txt
