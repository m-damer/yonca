name: Build signed APK
# Needs release/yonca-release.jks and the secret YONCA_KEY_PASSWORD (docs/SIGNING.md).
# M11 adds publishing to GitHub Releases.
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare signing
        env:
          PASS: ${{ secrets.YONCA_KEY_PASSWORD }}
        run: |
          test -f release/yonca-release.jks || { echo "::error::release/yonca-release.jks is missing. Run Generate release signing key first."; exit 1; }
          test -n "$PASS" || { echo "::error::Secret YONCA_KEY_PASSWORD is missing."; exit 1; }
          cp release/yonca-release.jks android/app/yonca-release.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=yonca\nstoreFile=yonca-release.jks\n" "$PASS" "$PASS" > android/key.properties
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release
      - name: Show the signing fingerprint
        run: keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -E "SHA256:" | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: yonca-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
