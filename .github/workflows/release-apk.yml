name: Build signed APK
# Needs release/yonca-release.jks and the secret YONCA_KEY_PASSWORD (docs/SIGNING.md).
# Publishes a GitHub Release with the APK and its SHA-256, which the app's Updates screen reads.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: What's new (shown in the app)
        required: false
        default: ''
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare signing
        env:
          PASS: ${{ secrets.YONCA_KEY_PASSWORD }}
        run: |
          test -f release/yonca-release.jks || { echo "::error::release/yonca-release.jks is missing. Run Generate release signing key first."; exit 1; }
          test -n "$PASS" || { echo "::error::Secret YONCA_KEY_PASSWORD is missing."; exit 1; }
          cp release/yonca-release.jks android/app/yonca-release.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=yonca\nstoreFile=yonca-release.jks\n" "$PASS" "$PASS" > android/key.properties
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release
      - name: Show the signing fingerprint
        run: keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -E "SHA256:" | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: yonca-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "::error::Release $TAG already exists. Raise the version in pubspec.yaml first."; exit 1; fi
          cp build/app/outputs/flutter-apk/app-release.apk yonca.apk
          sha256sum yonca.apk > yonca.apk.sha256
          gh release create "$TAG" yonca.apk yonca.apk.sha256 --title "YONCA $VERSION" --notes "${NOTES:-Version $VERSION}"
