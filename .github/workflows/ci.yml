name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check the Android project files are committed
        run: |
          test -d android
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: |
          set +e
          flutter analyze > analyze.txt 2>&1
          code=$?
          grep -E "(error|warning|info) •" analyze.txt | head -40 | while read -r l; do echo "::error::$l"; done
          exit $code
      - name: Test
        run: |
          set +e
          flutter test --reporter expanded > test.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then (tail -60 test.txt | tr '\n' '|' | cut -c1-3500; echo) | while read -r l; do echo "::error::$l"; done; fi
          exit $code
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: yonca-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
